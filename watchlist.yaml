# ============================================================
#  YOUR WATCHLIST  —  what gets HIGHLIGHTED and ALERTED
# ============================================================
# NOTE (v2): the dashboard now shows ALL deals it finds. This watchlist no
# longer hides anything — instead, deals matching these keywords get tagged
# with a category, boosted to the top, and are the ones that trigger a
# Telegram alert. So keep it broad; you won't miss other deals on the site.
#
# Edit on GitHub from your iPad: tap the file -> pencil -> Commit.

# Telegram alerts only fire for matches with at least this discount.
# (Does NOT hide anything on the website — display shows everything.)
alert_min_discount_percent: 15

# Max deals kept on the dashboard (newest/best first).
max_deals: 400

categories:
  shoes:
    - nike
    - adidas
    - sneakers
    - running shoes
    - new balance
    - hoka
    - jordan
    - boots
    - loafers

  clothing:
    - dress
    - gown
    - maxi dress
    - jeans
    - jacket
    - hoodie
    - t-shirt
    - "women's"
    - "men's"
    - activewear

  beauty:
    - skincare
    - makeup
    - fragrance
    - perfume
    - sephora
    - ulta
    - serum

  movies_media:
    - blu-ray
    - blu ray
    - 4k uhd
    - steelbook
    - movie
    - vinyl
    - books

  food_delivery:
    - doordash
    - door dash
    - uber eats
    - ubereats
    - grubhub
    - grub hub
    - promo code
    - "$ off"

  electronics:
    - airpods
    - headphones
    - earbuds
    - ssd
    - monitor
    - laptop
    - tablet
    - kindle
    - echo
    - tv
    - gpu
    - ssd

  gaming:
    - steam
    - nintendo
    - switch
    - playstation
    - ps5
    - xbox
    - game deal

  home:
    - vacuum
    - air fryer
    - mattress
    - cookware
    - kitchen
    - furniture
