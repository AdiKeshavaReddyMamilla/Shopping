# ============================================================
#  STORE DIRECTORY  —  browse coupons by store (150+ retailers)
# ============================================================
# This powers the "Stores" tab. For EVERY store the dashboard shows:
#   • a logo (auto from the domain)
#   • "Official site"  -> https://<domain>
#   • "Sale page"      -> the store's own sale page (if listed below)
#   • "All coupons ↗"  -> a live, always-current coupons page for that store
#   • any known codes below, each with a one-tap Copy button
#
# You only need: name, category, domain. Optional: sale, codes.
#   codes: [{code: SAVE10, desc: "10% off first order"}]
#
# WHY THIS IS RELIABLE: the "All coupons" link is generated live per store, so
# even when a code below goes stale, current codes are always one tap away.

